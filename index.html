<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Settings -->
    <title>TRACK2LIFT - Seu treino, sua dieta, um app.</title>
    <meta name="description" content="Acompanhe seus treinos e dieta com inteligência.">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#181818">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo_mobile.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#181818',
                        texto: '#FCFCFC',
                        destaque: '#DC2626',
                        'zinc-850': '#1f1f22',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['MontserratAlt1', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        html {
            width: 100%;
            height: 100%;
        }
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #181818;
            /* Using clip prevents scrollbars without creating a new formatting context that breaks sticky */
            overflow-x: clip; 
            overscroll-behavior-y: none;
        }

        #root {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Trava o scroll do fundo quando modais (Portals) estiverem abertos */
        body.modal-open {
            overflow: hidden !important;
            height: 100vh;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(220, 38, 38, 0.2); border-radius: 10px; }

        input[type="date"] { color-scheme: dark; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.88.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "framer-motion": "https://esm.sh/framer-motion@^11.0.0"
  }
}
</script>
</head>
<body class="bg-fundo text-texto antialiased">
    <div id="root"></div>
</body>
</html>
