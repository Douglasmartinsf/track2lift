<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="color-scheme" content="dark">
    <!-- PWA Settings -->
    <title>TRACK2LIFT - Seu treino, sua dieta, um app.</title>
    <meta name="theme-color" content="#181818">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#181818',
                        texto: '#FCFCFC',
                        destaque: '#DC2626',
                        'zinc-850': '#1f1f22',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['MontserratAlt1', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* index.html: lock document scroll, keep scrolling inside `main` element */
        html, body {
            height: 100dvh; /* dynamic viewport height for mobile */
            overflow: hidden; /* prevent elastic/document bounce */
            margin: 0;
            padding: 0;
            background-color: #181818;
        }

        /* Utility: hide visual scrollbar but keep scrolling */
        .no-scrollbar {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        .no-scrollbar::-webkit-scrollbar { display: none; } /* Chrome, Safari and Opera */

        /* Trava o scroll do fundo quando modais (Portals) estiverem abertos */
        body.modal-open { overflow: hidden !important; height: 100dvh; }

        input[type="date"] { color-scheme: dark; }
    </style>
    <!-- Entrypoint para Vite: permite que o build inclua/empacote os módulos do projeto -->
</head>
<body class="bg-fundo text-white font-sans selection:bg-destaque/30 antialiased">
    <div id="root"></div>
        <script type="module" src="/index.tsx"></script>
</body>
</html>
