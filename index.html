<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- PWA Settings -->
    <title>TRACK2LIFT - Seu treino, sua dieta, um app.</title>
    <meta name="theme-color" content="#181818">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#181818',
                        texto: '#FCFCFC',
                        destaque: '#DC2626',
                        'zinc-850': '#1f1f22',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['MontserratAlt1', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Aggressively hide scrollbars globally (desktop + mobile webkit + specific elements) */
        * {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        html {
            width: 100%;
            height: 100%;
        }
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #181818;
            /* Using clip prevents scrollbars without creating a new formatting context that breaks sticky */
            overflow-x: clip; 
            overscroll-behavior-y: none;
        }

        #root {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Trava o scroll do fundo quando modais (Portals) estiverem abertos */
        body.modal-open {
            overflow: hidden !important;
            height: 100vh;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(220, 38, 38, 0.2); border-radius: 10px; }

        input[type="date"] { color-scheme: dark; }
    </style>
    <!-- Entrypoint para Vite: permite que o build inclua/empacote os módulos do projeto -->
</head>
<body class="bg-fundo text-white font-sans selection:bg-destaque/30 antialiased">
    <div id="root"></div>
        <script type="module" src="/index.tsx"></script>
</body>
</html>
